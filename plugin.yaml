name: changefreeze
version: 0.1.0
description: >-
  An AI helper can ship code at a bad time and break something that is live.
  ChangeFreeze lets you set a quiet window. During that window, Hermes asks you
  before it ships. Everyday work still runs. When the window ends, shipping
  continues again. Local only — no off-machine data.
author: arults
provides_tools:
  - changefreeze_set
  - changefreeze_status
  - changefreeze_ledger
  - changefreeze_allow_once
  - changefreeze_patterns
provides_hooks:
  - pre_tool_call
provides_commands:
  - freeze
